[package]
name = "gps_mocker"
version = "2.1.0"
description = "Send Mocked GPS to Android/iOS devices"
authors = [ "dev@akylasfr" ]
license = "MIT"
repository = "https://github.com/farfromrefug/gps_mocker"
default-run = "gps_mocker"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4.15"
byteorder = "1.4.3"
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
openssl = "0.10.42"

[target."cfg(any(target_os = \"ios\", target_os = \"macos\"))".dependencies.rusty_libimobiledevice]
features = [ "static", "vendored" ]
# Local fork of https://github.com/jkcoxson/rusty_libimobiledevice @ b6cdf4bb
# Only change: build.rs pins the vendored libimobiledevice clone to tag 1.3.0
# (master requires libtatsu, which the vendored chain does not build).
path = "vendor/rusty_libimobiledevice"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"

[target."cfg(any(target_os = \"ios\", target_os = \"macos\"))".dependencies]
cocoa = "0.24"
objc = "0.2"
