[package]
name = "tauri-plugin-mock-location"
version = "0.1.0"
description = "Publish mocked locations through Android's own test location provider"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-mock-location"

[build-dependencies]
tauri-plugin = { version = "2", features = [ "build" ] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
